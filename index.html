<!DOCTYPE html> <html lang="bn"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"> <title>Desi Video Bot</title> <script src="https://telegram.org/js/telegram-web-app.js"></script> <style>   :root{     --bg:#12161c; --card:#1b222b; --line:#28323f;     --fg:#f2f5f8; --dim:#93a1b1; --acc:#2ea6ff; --acc2:#7b5cff;   }   *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}   body{margin:0;background:var(--bg);color:var(--fg);        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}   .wrap{max-width:560px;margin:0 auto;padding:0 14px 34px}   .hero{background:linear-gradient(135deg,var(--acc2),var(--acc));         border-radius:0 0 22px 22px;padding:20px 14px 22px;margin:0 -14px 16px}   .hero h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}   .hero p{margin:6px 0 0;font-size:13px;opacity:.9}   .row{display:flex;align-items:center;gap:8px}   .search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);           background:var(--card);color:var(--fg);font-size:15px;outline:none}   .search::placeholder{color:var(--dim)}   .chips{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto;padding-bottom:2px}   .chip{flex:0 0 auto;padding:9px 14px;border-radius:20px;border:1px solid var(--line);         background:var(--card);color:var(--fg);font-size:13px;font-weight:600}   .chip:active{border-color:var(--acc)}   .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}   .card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;         background:var(--card);border:1px solid var(--line);transition:transform .08s ease}   .card:active{transform:scale(.985);border-color:var(--acc)}   .num{flex:0 0 42px;height:42px;border-radius:12px;display:flex;align-items:center;        justify-content:center;font-weight:800;font-size:15px;        background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}   .ttl{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35;        overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}   .play{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;         justify-content:center;background:rgba(46,166,255,.16);color:var(--acc);font-size:13px}   .empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:14px;line-height:1.7}   .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:20px;line-height:1.7} </style> </head> <body> <div class="wrap">   <div class="hero">     <h1 id="brand">🎬 Desi Video Bot</h1>     <p id="sub">ভিডিওতে চাপ দিন — ভিডিওটি চ্যাটে চলে আসবে</p>   </div>    <input id="q" class="search" type="search" placeholder="🔎 ভিডিওর নাম লিখে খুঁজুন..." autocomplete="off">    <div class="chips">     <button class="chip" id="rnd">🎲 যেকোনো একটি</button>     <button class="chip" id="clr">✖️ খোঁজা মুছুন</button>   </div>    <div class="list" id="list"></div>   <div class="foot" id="foot"></div> </div>  <script>   var tg = window.Telegram ? window.Telegram.WebApp : null;   var items = [];   var all = [];    if (tg) {     try { tg.ready(); tg.expand(); } catch (e) {}     try {       var t = tg.themeParams || {};       var r = document.documentElement.style;       if (t.bg_color) r.setProperty('--bg', t.bg_color);       if (t.secondary_bg_color) r.setProperty('--card', t.secondary_bg_color);       if (t.text_color) r.setProperty('--fg', t.text_color);       if (t.hint_color) r.setProperty('--dim', t.hint_color);       if (t.button_color) r.setProperty('--acc', t.button_color);     } catch (e) {}   }    // বটের পাঠানো তালিকা (?d=...)   try {     var raw = new URLSearchParams(window.location.search).get('d') || '';     if (raw) {       var obj = JSON.parse(raw);       if (obj && obj.v && obj.v.length) {         for (var i = 0; i < obj.v.length; i++) {           var it = obj.v[i];           if (it && it.i) {             all.push({ i: parseInt(it.i, 10), t: String(it.t || ('ভিডিও ' + it.i)) });           }         }       }     }   } catch (e) { all = []; }    items = all.slice();    function esc(s) {     return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');   }    function open(id) {     if (!tg || !tg.sendData) {       alert('এই অ্যাপটি Telegram-এর ভেতরে খুলুন।');       return;     }     // অ্যাপ বন্ধ হয়ে বট ভিডিওটি পাঠাবে     try {       tg.sendData(JSON.stringify({ i: parseInt(id, 10) }));     } catch (e) {       alert('পাঠানো গেল না। আবার চেষ্টা করুন।');     }   }    function render() {     var box = document.getElementById('list');     var foot = document.getElementById('foot');     box.innerHTML = '';     if (!items.length) {       box.innerHTML = '<div class="empty">কিছু পাওয়া যায়নি।<br>অন্য নাম দিয়ে খুঁজুন।</div>';       foot.textContent = '';       return;     }     var frag = document.createDocumentFragment();     for (var i = 0; i < items.length; i++) {       var it = items[i];       var d = document.createElement('div');       d.className = 'card';       d.innerHTML = '<div class="num">' + esc(it.i) + '</div>' +                     '<div class="ttl">' + esc(it.t) + '</div>' +                     '<div class="play">▶</div>';       (function (id) {         d.addEventListener('click', function () { open(id); });       })(it.i);       frag.appendChild(d);     }     box.appendChild(frag);     foot.innerHTML = 'মোট <b>' + all.length + '</b>টি ভিডিও · দেখানো হচ্ছে <b>' + items.length + '</b>টি';   }    document.getElementById('q').addEventListener('input', function () {     var q = this.value.trim().toLowerCase();     if (!q) { items = all.slice(); }     else {       items = [];       for (var i = 0; i < all.length; i++) {         if (String(all[i].t).toLowerCase().indexOf(q) >= 0 || String(all[i].i) === q) {           items.push(all[i]);         }       }     }     render();   });    document.getElementById('clr').addEventListener('click', function () {     document.getElementById('q').value = '';     items = all.slice();     render();   });    document.getElementById('rnd').addEventListener('click', function () {     if (!all.length) return;     open(all[Math.floor(Math.random() * all.length)].i);   });    render(); </script> </body> </html>
